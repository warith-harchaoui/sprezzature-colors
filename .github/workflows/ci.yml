name: ci

# Gentle, deterministic gate: ruff lint + pytest on the supported Python
# versions. No model calls, no network. Intentionally minimal.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Une poussée qui en suit une autre annule la première : sans ce groupe, deux
  # commits à une minute d'intervalle font tourner deux matrices de trois
  # versions de Python jusqu'au bout, et seul le second compte. Quatre dépôts
  # de la suite l'avaient, six ne l'avaient pas.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The package itself, editable, with the surfaces it advertises. Two
      # reasons, both learned the hard way. `sprezzature_colors/__init__.py`
      # imports `sprezzature_colors_scripts`, which is scripts/ under a
      # mapped name and only exists once installed -- without this the
      # package does not import at all on CI, and that break hid behind a
      # failing ruff step for a week. And without [api,mcp] every test of
      # the HTTP and agent-tool surfaces skips, so CI was green on code
      # nobody ran.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # The type half of the gate. Added after running mypy by hand found
      # the same real defect in all six packages: mcp.py's two `main`
      # definitions, the missing-extra fallback and the real one, took
      # different arguments. Once, on one version: this is a gate, not a
      # matrix. scripts/ is a separate invocation because those modules
      # import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_colors
          mypy scripts
      - name: Pytest
        run: pytest -q

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_colors"

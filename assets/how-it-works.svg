<svg xmlns="http://www.w3.org/2000/svg" width="980" height="893" viewBox="0 0 980 893" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="colors-hiw-title colors-hiw-desc"><title id="colors-hiw-title">How sprezzature-colors works</title><desc id="colors-hiw-desc">Flow diagram. At the top, a palette or an image feeds two lanes. The left lane audits: it composites any translucent colour, measures the WCAG contrast ratio of every pair, and simulates the three colour-vision deficiencies, returning a pass or fail per pair. The right lane makes: it holds hue and saturation fixed, walks the OKLCH lightness axis, and levels the whole palette, returning the nearest passing colour and a Tailwind configuration. Both meet in one outcome, a palette that survives a cheap screen, bright sunlight and a grayscale printer.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="893" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-colors works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">Three tools, and one channel underneath all three.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">A palette, or an image</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">hex codes in a JSON file, the curated house palette, or a PNG somebody is about to ship</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Audit: what a reader cannot separate</text><rect x="36" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Composite first, then measure</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">a translucent foreground is laid over its background before</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">the ratio is taken, because that is what the eye is given</text><path d="M254,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,358 L254,366 L258,358" fill="#C7C7CC"/><rect x="36" y="366" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="396" font-size="16" font-weight="600" fill="#1D1D1F">One WCAG ratio per pair</text><text x="54" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">AA at 4.5 to 1 for body text, AA-large at 3 to 1, AAA at 7 to 1.</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">The scale runs from 1, identical brightness, to 21, black on white.</text><path d="M254,452 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,468 L254,476 L258,468" fill="#C7C7CC"/><rect x="36" y="476" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="504" font-size="16" font-weight="600" fill="#1D1D1F">Simulate the three deficiencies</text><text x="54" y="528" font-size="13.5" font-weight="400" fill="#6E6E73">the Machado, Oliveira and Fernandes (2009) matrices</text><text x="54" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">for protanopia, deuteranopia and tritanopia, plus a grayscale pass</text><text x="54" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">that catches a distinction carried by hue alone</text><path d="M254,578 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,594 L254,602 L258,594" fill="#C7C7CC"/><rect x="36" y="637" width="436" height="68" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,649 v44" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="666" font-size="16" font-weight="600" fill="#1D1D1F">Pass or fail per pair, and three sibling images</text><text x="65" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">text or JSON, exit 1 on any failure</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Make: the nearest colour that still passes</text><rect x="508" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Hold the hue, hold the saturation</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">your brand blue has to stay your brand blue, or the fix will not</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">be taken</text><path d="M726,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,358 L726,366 L730,358" fill="#C7C7CC"/><rect x="508" y="366" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Walk the lightness axis in hundredth steps</text><text x="526" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">in OKLCH, where a fixed numeric step matches what the eye</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">calls an equal step in brightness. Plain RGB does not promise</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">that.</text><path d="M726,469 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,485 L726,493 L730,485" fill="#C7C7CC"/><rect x="508" y="493" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="522" font-size="16" font-weight="600" fill="#1D1D1F">Level the whole palette at once</text><text x="526" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">universal, high-contrast, monochrome, or one tuned to a single</text><text x="526" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">deficiency. Each colour is ranked by how bright it looks to that</text><text x="526" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">viewer, then spread across a legible band.</text><path d="M726,596 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,612 L726,620 L730,612" fill="#C7C7CC"/><rect x="508" y="620" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,632 v61" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="648" font-size="16" font-weight="600" fill="#1D1D1F">A passing colour, and a Tailwind block</text><text x="537" y="672" font-size="13.5" font-weight="400" fill="#6E6E73">a theme.extend.colors snippet or a full configuration, so no</text><text x="537" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">project in the stack hand-copies a hex code</text><path d="M254,704 V726 H490 V738" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,738 L490,746 L494,738" fill="#C7C7CC"/><path d="M726,704 V726 H490 V738" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,738 L490,746 L494,738" fill="#C7C7CC"/><rect x="36" y="746" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,758 v61" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="776" font-size="16" font-weight="600" fill="#1D1D1F">A palette that survives a cheap screen, bright sunlight, a grayscale printer, and one man in twelve</text><text x="65" y="800" font-size="13.5" font-weight="400" fill="#6E6E73">No single set of colours is best for protanopia, deuteranopia and tritanopia at once: widening the spacing for one eye closes it</text><text x="65" y="817" font-size="13.5" font-weight="400" fill="#6E6E73">for another. That is why universal is the default and the rest are options.</text><text x="36" y="858" font-size="13.5" font-weight="400" fill="#6E6E73">Standard library only, and no network and no model anywhere in it. Pillow is needed to read and write an image, and nothing else is.</text></svg>

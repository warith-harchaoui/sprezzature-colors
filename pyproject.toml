[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-colors"
version = "1.4.0"
description = "Color accessibility and palette tooling for the sprezzature stack: WCAG contrast auditing, color vision deficiency simulation, and Tailwind CSS palette export."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["color", "accessibility", "wcag", "tailwind", "cvd", "palette", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The command line, and the only one since 2026-10-25. This package
    # deliberately carried **no** base dependencies, and click is the one
    # exception bought on purpose: with argparse gone there is no parser
    # left that ships with Python, so an optional click would mean a
    # `pip install sprezzature-colors` whose own commands do not run.
    #
    # The per-tool scripts (sprezzature-colors-contrast and friends) and the
    # MCP server's own flags are click too since 2026-11-04 (scripts/_click.py);
    # the scripts need nothing beyond this, so the pre-commit case stays cheap.
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 1
    # dependency, so `pip install sprezzature-colors` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "Pillow>=10.0",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]

[project.scripts]
sprezzature-colors-skill = "sprezzature_colors._skill:main"
# Two spellings of one click front door over the four tools
# (sprezzature_colors/cli.py, catalogue in sprezzature_colors/_tools.py);
# argparse was removed from the front door on 2026-10-25, and from every other
# command, the per-tool ones and the MCP server, on 2026-11-04. Then the MCP server,
# and one console script per tool, which is what a script or a pre-commit
# hook should call. Until the front door existed there was no way to find out
# what this package does except by reading its README: each tool had its own
# console script and nothing listed them together.
make-colors = "sprezzature_colors.cli:main"
sprezzature-colors = "sprezzature_colors.cli:main"
sprezzature-colors-mcp = "sprezzature_colors.mcp:main"
sprezzature-colors-contrast = "sprezzature_colors_scripts.audit_contrast:main"
sprezzature-colors-cvd = "sprezzature_colors_scripts.simulate_cvd:main"
sprezzature-colors-levels = "sprezzature_colors_scripts.accessibility_levels:main"
sprezzature-colors-palette-to-tailwind = "sprezzature_colors_scripts.palette_to_tailwind:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-colors"

[tool.setuptools]
packages = ["sprezzature_colors", "sprezzature_colors_scripts", "sprezzature_colors_references"]

[tool.setuptools.package-dir]
"sprezzature_colors_scripts" = "scripts"
"sprezzature_colors_references" = "references"

[tool.setuptools.package-data]
# The skill an agent reads ships inside the package, so `pip install`
# carries all five surfaces; `sprezzature-colors-skill --install` puts it
# where Claude Code or OpenCode looks.
"sprezzature_colors" = ["skill/**/*"]
"sprezzature_colors_references" = ["palette.csv", "palette-corporate.csv", "palette-academic.csv", "palette-print.csv"]

[tool.pytest.ini_options]
# This repository had no pytest section at all: no `testpaths`, so a bare
# `pytest` collected from the root and would have swept up anything under
# `build/` or a stray venv, and no `--strict-markers` either.
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- tests/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-colors"
version = "1.0.0"
description = "Color accessibility and palette tooling for the sprezzature stack: WCAG contrast auditing, color vision deficiency simulation, and Tailwind CSS palette export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"}]
keywords = ["color", "accessibility", "wcag", "tailwind", "cvd", "palette", "sprezzature"]
dependencies = []

[project.optional-dependencies]
cvd = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff"]
# HTTP surface (sprezzature_colors/api.py): the library's functions over
# HTTP, so a design system in another language can run the same checks.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface (sprezzature_colors/mcp.py): the same routes republished as
# agent tools. Pinned loosely because fastapi-mcp has already split mount()
# into transport-specific entry points once; mcp.py handles both shapes.
mcp = [
    "sprezzature-colors[api]",
    "fastapi-mcp>=0.3",
]

[project.scripts]
sprezzature-colors-mcp = "sprezzature_colors.mcp:main"
sprezzature-colors-contrast = "sprezzature_colors_scripts.audit_contrast:main"
sprezzature-colors-cvd = "sprezzature_colors_scripts.simulate_cvd:main"
sprezzature-colors-levels = "sprezzature_colors_scripts.accessibility_levels:main"
sprezzature-colors-palette-to-tailwind = "sprezzature_colors_scripts.palette_to_tailwind:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-colors"

[tool.setuptools]
packages = ["sprezzature_colors", "sprezzature_colors_scripts", "sprezzature_colors_references"]

[tool.setuptools.package-dir]
"sprezzature_colors_scripts" = "scripts"
"sprezzature_colors_references" = "references"

[tool.setuptools.package-data]
"sprezzature_colors_references" = ["palette.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

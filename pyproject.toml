[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-colors"
version = "1.1.0"
description = "Color accessibility and palette tooling for the sprezzature stack: WCAG contrast auditing, color vision deficiency simulation, and Tailwind CSS palette export."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["color", "accessibility", "wcag", "tailwind", "cvd", "palette", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
cvd = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff", "mypy"]
# The click front door only. This package declares no base dependencies, and
# that is the reason its contrast audit is cheap enough for a pre-commit hook
# — so click, which only one of the two front doors needs, is an extra rather
# than a dependency. `make-colors` needs nothing.
click = ["click>=8.0"]
# HTTP surface (sprezzature_colors/api.py): the library's functions over
# HTTP, so a design system in another language can run the same checks.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface (sprezzature_colors/mcp.py): the same routes republished as
# agent tools. Pinned loosely because fastapi-mcp has already split mount()
# into transport-specific entry points once; mcp.py handles both shapes.
mcp = [
    "sprezzature-colors[api]",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 (the latest as of 2026-08) declares mcp>=1.12.0 with
    # no upper bound, but calls mcp's Server(name, description) positionally
    # -- mcp 2.0.0 made `description` keyword-only, so an unconstrained
    # resolve breaks FastApiMCP(...) at construction time (verified: pip
    # happily installs mcp 2.2.0 alongside fastapi-mcp 0.4.0, and
    # `sprezzature_colors.mcp` then raises TypeError on import). Pin below
    # 2.0 until fastapi-mcp ships a fix.
    "mcp<2.0",
]

[project.scripts]
# The two front doors, over the same four tools and the same table
# (sprezzature_colors/cli.py). argparse because it is in the standard library
# and therefore always there; click because its sub-commands carry the shape
# without hand-rolling it. Until these existed there was no way to find out
# what this package does except by reading its README — each tool had its own
# console script and nothing listed them together.
make-colors = "sprezzature_colors.cli:main"
sprezzature-colors = "sprezzature_colors.cli_click:main"
sprezzature-colors-mcp = "sprezzature_colors.mcp:main"
sprezzature-colors-contrast = "sprezzature_colors_scripts.audit_contrast:main"
sprezzature-colors-cvd = "sprezzature_colors_scripts.simulate_cvd:main"
sprezzature-colors-levels = "sprezzature_colors_scripts.accessibility_levels:main"
sprezzature-colors-palette-to-tailwind = "sprezzature_colors_scripts.palette_to_tailwind:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-colors"

[tool.setuptools]
packages = ["sprezzature_colors", "sprezzature_colors_scripts", "sprezzature_colors_references"]

[tool.setuptools.package-dir]
"sprezzature_colors_scripts" = "scripts"
"sprezzature_colors_references" = "references"

[tool.setuptools.package-data]
"sprezzature_colors_references" = ["palette.csv"]

[tool.pytest.ini_options]
# This repository had no pytest section at all: no `testpaths`, so a bare
# `pytest` collected from the root and would have swept up anything under
# `build/` or a stray venv, and no `--strict-markers` either.
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- tests/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

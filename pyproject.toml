[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-colors"
version = "1.0.0"
description = "Color accessibility and palette tooling for the sprezzature stack: WCAG contrast auditing, color vision deficiency simulation, and Tailwind CSS palette export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"}]
keywords = ["color", "accessibility", "wcag", "tailwind", "cvd", "palette", "sprezzature"]
dependencies = []

[project.optional-dependencies]
cvd = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff"]

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-colors"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
